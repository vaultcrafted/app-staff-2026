<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>INVIBE Staff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
      html,body,#root{height:100%;margin:0;font-family:Barlow,sans-serif;background:#F5F7FB;}
      button{transition:transform .14s ease, background-color .2s ease, border-color .2s ease;}
      button:active{transform:scale(.985);}
      input{font-family:Barlow,sans-serif;}
      @keyframes notifIn{0%{opacity:0;transform:translateY(-14px) scale(.9)}55%{opacity:1;transform:translateY(3px) scale(1.03)}78%{transform:translateY(-1px) scale(.995)}100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes notifOut{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-12px) scale(.92)}}
      @keyframes bgIn{from{opacity:0}to{opacity:1}}
      @keyframes bgOut{from{opacity:1}to{opacity:0}}
      @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
    </style>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#255FF0" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="INVIBE" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
